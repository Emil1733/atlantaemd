name: Four-city claims cleanup
on:
  push:
    branches: [seo-p2-claims-cleanup]
permissions:
  contents: write
jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-p2-claims-cleanup
      - name: Clean unsupported claims
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages=['alpharetta-pool-removal.html','sandy-springs-pool-removal.html','decatur-pool-removal.html','dunwoody-pool-removal.html']
          replacements={
          'ensuring 100% compliance':'supporting project planning',
          '100% compliance':'project-specific compliance',
          '100% buildable':'suitable for the intended future use when properly planned',
          'zero long-term settlement or sinkhole risk':'reduced settlement risk when backfill and compaction are properly designed',
          'zero settlement risk':'reduced settlement risk',
          'zero settling':'reduced settlement risk',
          'guaranteed stable':'prepared for the intended future use',
          'guaranteed stability':'appropriate preparation for the intended future use',
          'lifetime zero-settling warranty':'documented backfill and compaction approach',
          'Lifetime Zero-Settling Warranty':'Documented Backfill & Compaction Approach',
          'immediate architectural approval':'HOA review',
          'mandatory <strong>City of Milton Arborist Review</strong>':'a possible <strong>local tree or arborist review</strong>, depending on the property and jurisdiction',
          'the full management of <strong>Land Disturbance Permits (LDP)</strong>':'planning for any <strong>land-disturbance or demolition permits</strong> that apply to the specific property',
          'We ensure that your project is bonded and insured to the standards required for high-value estate restoration.':'Before hiring a contractor, verify current licensing, insurance, permit, and project requirements for your property.',
          'We act as your technical representative for neighborhood HOAs (including <strong>White Columns</strong> and <strong>The Manor</strong>), providing the engineered site plans and compaction data required for HOA review.':'For HOA-controlled properties, confirm the association’s current submittal requirements before demolition; plans, access details, restoration drawings, or contractor documents may be requested.',
          'We act as your technical representative for neighborhood HOAs (including <strong>White Columns</strong> and <strong>The Manor</strong>), providing the engineered site plans and compaction data required for immediate architectural approval.':'For HOA-controlled properties, confirm the association’s current submittal requirements before demolition; plans, access details, restoration drawings, or contractor documents may be requested.',
          'Compaction Goal:</strong> 95% Modified Proctor':'Compaction:</strong> Follow the project engineer or applicable local requirement when structural future use is planned',
          'Logistical Standard:</strong> Zero-Impact Tracked Machinery':'Access Planning:</strong> Match equipment size and ground protection to the property',
          'restore your land to its original hydrologic state':'restore and regrade the former pool area for its planned future use',
          'strict E&amp;S (Erosion and Sedimentation) rules that exceed standard residential codes':'erosion, drainage, and land-disturbance requirements that should be confirmed for the specific property',
          'requires surgical precision':'can require careful access planning',
          'High-density luxury developments':'Established residential properties',
          'preserve $100k+ driveway installations and mature specimen trees':'reduce avoidable damage to driveways, landscaping, and mature trees',
          'require advanced hydrologic management':'can require careful drainage and grading planning',
          'We establish permanent <strong>subterranean drainage swales</strong> that redirect stormwater toward established watershed points, preventing the "Bathtub Effect" in former **Alpharetta** pool basins.':'The final grading and drainage plan should move water away from structures and avoid creating a low area where the pool once sat.',
          }
          patterns=[
            (r'(?i)\bno disclosure required\b','disclosure requirements vary by transaction and jurisdiction'),
            (r'(?i)\bnever settle\b','reduce the risk of future settlement'),
            (r'(?i)\bwill not settle\b','is intended to reduce future settlement'),
            (r'(?i)\bguarantee(?:d|s)?\b','support'),
          ]
          for fn in pages:
            p=Path(fn); t=p.read_text(encoding='utf-8')
            for a,b in replacements.items(): t=t.replace(a,b)
            for pat,b in patterns: t=re.sub(pat,b,t)
            # Remove pseudo-precision and unverifiable sales absolutes while keeping useful process context.
            t=re.sub(r'(?i)\b95%\s+Modified\s+Proctor\b','project-specific compaction target',t)
            t=re.sub(r'(?i)\b95%\s+Proctor\b','project-specific compaction target',t)
            t=re.sub(r'(?i)\$100k\+','high-value',t)
            p.write_text(t,encoding='utf-8')
          banned=['100% buildable','zero long-term settlement','zero settlement risk','zero-settling warranty','no disclosure required','immediate architectural approval','$100k+']
          bad=[]
          for fn in pages:
            low=Path(fn).read_text(encoding='utf-8').lower()
            for x in banned:
              if x.lower() in low: bad.append((fn,x))
          if bad:
            print(bad); raise SystemExit(1)
          print('Claims cleanup verification passed')
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alpharetta-pool-removal.html sandy-springs-pool-removal.html decatur-pool-removal.html dunwoody-pool-removal.html
          git commit -m 'SEO P2: remove unsupported claims from experiment pages'
          git push origin HEAD:seo-p2-claims-cleanup
