name: Phase 1 architecture cleanup v3

on:
  push:
    branches:
      - seo-p1-architecture

permissions:
  contents: write

jobs:
  architecture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-p1-architecture
      - name: Build and verify county-first hierarchy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          city_map={
            'alpharetta-pool-removal.html':('Fulton County','fulton-county-pool-removal.html','Alpharetta'),'sandy-springs-pool-removal.html':('Fulton County','fulton-county-pool-removal.html','Sandy Springs'),'roswell-pool-removal.html':('Fulton County','fulton-county-pool-removal.html','Roswell'),
            'decatur-pool-removal.html':('DeKalb County','dekalb-county-pool-removal.html','Decatur'),'dunwoody-pool-removal.html':('DeKalb County','dekalb-county-pool-removal.html','Dunwoody'),
            'marietta-pool-removal.html':('Cobb County','cobb-county-pool-removal.html','Marietta'),'kennesaw-pool-removal.html':('Cobb County','cobb-county-pool-removal.html','Kennesaw'),'vinings-pool-removal.html':('Cobb County','cobb-county-pool-removal.html','Vinings'),
            'lawrenceville-pool-removal.html':('Gwinnett County','gwinnett-county-pool-removal.html','Lawrenceville'),'duluth-pool-removal.html':('Gwinnett County','gwinnett-county-pool-removal.html','Duluth'),'suwanee-pool-removal.html':('Gwinnett County','gwinnett-county-pool-removal.html','Suwanee'),'snellville-pool-removal.html':('Gwinnett County','gwinnett-county-pool-removal.html','Snellville'),'buford-pool-removal.html':('Gwinnett County','gwinnett-county-pool-removal.html','Buford')}
          county_map={'fulton-county-pool-removal.html':'Fulton County','dekalb-county-pool-removal.html':'DeKalb County','cobb-county-pool-removal.html':'Cobb County','gwinnett-county-pool-removal.html':'Gwinnett County'}
          changed=[]

          p=Path('index.html'); t=p.read_text(encoding='utf-8')
          if 'Browse Pool Removal by County' not in t:
              heading='<span style="font-size: 1.5rem; margin-right: 15px;">📍</span> Neighborhood-Specific Expertise'
              h=t.find(heading)
              if h<0: raise SystemExit('Homepage neighborhood block not found')
              start=t.rfind('          <div style="margin-bottom: 20px;">',0,h)
              end_marker='          </div>\n        </div>\n        <div>\n          <img loading="lazy" src="assets/process-1.webp"'
              end=t.find(end_marker,h)
              if start<0 or end<0: raise SystemExit('Could not isolate homepage neighborhood block')
              replacement='''          <div style="margin-bottom: 20px;">\n            <h3 style="color: var(--primary-orange); display: flex; align-items: center; margin-bottom: 15px;">\n              <span style="font-size: 1.5rem; margin-right: 15px;">📍</span> Browse Pool Removal by County\n            </h3>\n            <p style="line-height: 1.7; color: #444; margin-bottom: 20px;">Metro Atlanta permitting, access, drainage, and site conditions vary by jurisdiction. Start with your county hub, then choose the city guide for your property.</p>\n            <div class="grid-2" style="gap: 15px;">\n              <div style="background: #f8f9fa; padding: 18px; border-radius: 8px; border: 1px solid #eee; font-size: 0.9rem;"><strong style="display: block; margin-bottom: 5px;"><a href="fulton-county-pool-removal.html">Fulton County Pool Removal</a></strong>Atlanta, Sandy Springs, Roswell, Alpharetta and nearby communities.</div>\n              <div style="background: #f8f9fa; padding: 18px; border-radius: 8px; border: 1px solid #eee; font-size: 0.9rem;"><strong style="display: block; margin-bottom: 5px;"><a href="dekalb-county-pool-removal.html">DeKalb County Pool Removal</a></strong>Decatur, Dunwoody and surrounding DeKalb communities.</div>\n              <div style="background: #f8f9fa; padding: 18px; border-radius: 8px; border: 1px solid #eee; font-size: 0.9rem;"><strong style="display: block; margin-bottom: 5px;"><a href="cobb-county-pool-removal.html">Cobb County Pool Removal</a></strong>Marietta, Kennesaw, Vinings and nearby Cobb communities.</div>\n              <div style="background: #f8f9fa; padding: 18px; border-radius: 8px; border: 1px solid #eee; font-size: 0.9rem;"><strong style="display: block; margin-bottom: 5px;"><a href="gwinnett-county-pool-removal.html">Gwinnett County Pool Removal</a></strong>Lawrenceville, Duluth, Suwanee, Snellville, Buford and nearby communities.</div>\n            </div>\n          </div>\n'''
              t=t[:start]+replacement+t[end:]
              p.write_text(t,encoding='utf-8'); changed.append('index.html')

          def add_crumb(path,html):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if 'seo-breadcrumb' in text: return
              pat=re.compile(r'(<script[^>]*type="application/ld\+json"[^>]*>\s*\{.*?"@type"\s*:\s*"BreadcrumbList".*?</script>)',re.I|re.S)
              m=pat.search(text)
              if m: pos=m.end()
              else:
                  m=re.search(r'</section>',text,re.I)
                  if not m: raise SystemExit(f'No safe insertion point: {path}')
                  pos=m.end()
              p.write_text(text[:pos]+'\n'+html+'\n'+text[pos:],encoding='utf-8'); changed.append(path)

          for path,(county,parent,city) in city_map.items():
              add_crumb(path,f'''  <div class="container seo-breadcrumb" style="padding-top: 18px; padding-bottom: 0; font-size: 0.9rem; color: #666;">\n    <a href="/">Atlanta Pool Removal</a> <span aria-hidden="true">›</span> <a href="{parent}">{county} Pool Removal</a> <span aria-hidden="true">›</span> <span>{city}</span>\n  </div>''')
          for path,county in county_map.items():
              add_crumb(path,f'''  <div class="container seo-breadcrumb" style="padding-top: 18px; padding-bottom: 0; font-size: 0.9rem; color: #666;">\n    <a href="/">Atlanta Pool Removal</a> <span aria-hidden="true">›</span> <span>{county} Pool Removal</span>\n  </div>''')

          bad=[]; home=Path('index.html').read_text(encoding='utf-8')
          if 'Browse Pool Removal by County' not in home: bad.append('homepage county block')
          for c in ['fulton','dekalb','cobb','gwinnett']:
              if f'href="{c}-county-pool-removal.html"' not in home: bad.append('homepage '+c)
          for path,(_,parent,_) in city_map.items():
              tx=Path(path).read_text(encoding='utf-8')
              if 'seo-breadcrumb' not in tx or f'href="{parent}"' not in tx: bad.append(path)
          for path in county_map:
              if 'seo-breadcrumb' not in Path(path).read_text(encoding='utf-8'): bad.append(path)
          if bad:
              print('Verification failures:',bad); raise SystemExit(1)
          print('Phase 1 hierarchy verification passed; updated',len(changed),'files')
          PY
      - name: Commit architecture changes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git commit -m 'SEO P1: establish county-first internal linking hierarchy'
          git push origin HEAD:seo-p1-architecture
