name: Fix inconsistent metadata

on:
  push:
    branches:
      - seo-p0-metadata-cleanup

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-p0-metadata-cleanup
      - name: Clean titles and descriptions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, html

          updates = {
            'index.html': {
              'title': 'Pool Removal Atlanta, GA | Demolition, Fill-In & Cost',
              'desc': 'Pool removal in Atlanta, GA for unwanted inground pools. Compare demolition and fill-in options, typical costs, permits, timelines, and request an estimate.'
            },
            'about.html': {
              'desc': 'Learn about Atlanta Pool Removal Pros, our approach to pool demolition, site restoration, permitting, drainage, and backfill planning across Metro Atlanta.'
            },
            'alpharetta-pool-removal.html': {
              'desc': 'Pool removal in Alpharetta, GA with guidance on demolition options, access, permits, backfill, drainage, typical costs, and restoring your backyard.'
            },
            'atlanta-pool-removal-permits.html': {
              'desc': 'Atlanta pool removal permit guide covering demolition approvals, local jurisdiction differences, inspections, site plans, utilities, and project closeout steps.'
            },
            'blog/atlanta-backyard-renovation-2026.html': {
              'desc': 'Explore 2026 Atlanta backyard renovation ideas, including pool removal, usable lawn space, patios, drainage improvements, landscaping, and outdoor living upgrades.'
            },
            'blog/is-your-atlanta-pool-a-money-pit.html': {
              'desc': 'Compare the ongoing cost of keeping an aging Atlanta pool with renovation or removal, including maintenance, repairs, utilities, safety, and backyard usability.'
            },
            'blog/marietta-pool-removal-permit-guide.html': {
              'desc': 'Marietta pool removal permit guide covering City of Marietta and Cobb County requirements, inspections, demolition planning, utilities, and project closeout.'
            },
            'buford-pool-removal.html': {
              'desc': 'Pool removal in Buford, GA with guidance on demolition, drainage, access, permits, backfill, Lake Lanier-area considerations, costs, and yard restoration.'
            },
            'cobb-county-pool-removal.html': {
              'desc': 'Pool removal in Cobb County, GA for Marietta, Smyrna, Kennesaw, Vinings, and nearby areas. Learn about permits, demolition, backfill, drainage, access, and costs.'
            },
            'decatur-pool-removal.html': {
              'desc': 'Pool removal in Decatur, GA with guidance for tight-access lots, DeKalb permitting, demolition options, drainage, backfill, typical costs, and yard restoration.'
            },
            'duluth-pool-removal.html': {
              'desc': 'Pool removal in Duluth, GA with guidance on demolition, access, drainage, backfill, Gwinnett permits, typical costs, and restoring residential yards.'
            },
            'dunwoody-pool-removal.html': {
              'title': 'Pool Removal Dunwoody, GA | Cost & Demolition',
              'desc': 'Pool removal in Dunwoody, GA with guidance on demolition, tight access, drainage, DeKalb permitting, backfill, typical costs, and backyard restoration.'
            },
            'fulton-county-pool-removal.html': {
              'desc': 'Pool removal in Fulton County, GA for Atlanta, Sandy Springs, Roswell, Alpharetta, and nearby areas. Learn about permits, demolition, drainage, backfill, and costs.'
            },
            'gwinnett-county-pool-removal.html': {
              'desc': 'Pool removal in Gwinnett County, GA for Lawrenceville, Duluth, Suwanee, Buford, Snellville, and nearby areas. Compare permits, demolition, drainage, backfill, and costs.'
            },
            'kennesaw-pool-removal.html': {
              'desc': 'Pool removal in Kennesaw, GA with guidance on Cobb County permitting, demolition options, access, drainage, backfill, typical costs, and backyard restoration.'
            },
            'lawrenceville-pool-removal.html': {
              'title': 'Pool Removal Lawrenceville, GA | Cost & Demolition',
              'desc': 'Pool removal in Lawrenceville, GA with guidance on Gwinnett permitting, demolition, drainage, backfill, access, typical costs, and restoring your backyard.'
            },
            'marietta-pool-removal.html': {
              'desc': 'Pool removal in Marietta, GA with guidance on City and Cobb County permits, demolition options, access, drainage, backfill, typical costs, and yard restoration.'
            },
            'peachtree-city-pool-removal.html': {
              'desc': 'Pool removal in Peachtree City, GA with guidance on Fayette County permitting, golf-cart-path access, demolition, drainage, backfill, costs, and yard restoration.'
            },
            'pool-removal-decatur-case-study.html': {
              'title': 'Decatur Pool Fill-In Case Study | Cost & Tight Access',
              'desc': 'Decatur pool fill-in case study covering a $9,200 project, tight backyard access, partial removal, DeKalb permitting, demolition steps, and site restoration.'
            },
            'roswell-pool-removal.html': {
              'desc': 'Pool removal in Roswell, GA with guidance on Fulton County permitting, demolition options, drainage, access, backfill, typical costs, and backyard restoration.'
            },
            'sandy-springs-pool-removal.html': {
              'desc': 'Pool removal in Sandy Springs, GA with guidance on Fulton County permitting, demolition, drainage, access, backfill, typical costs, and yard restoration.'
            },
            'snellville-pool-removal.html': {
              'desc': 'Pool removal in Snellville, GA with guidance on septic protection, Gwinnett permitting, demolition, drainage, backfill, typical costs, and yard restoration.'
            },
            'suwanee-pool-removal.html': {
              'desc': 'Pool removal in Suwanee, GA with guidance on Gwinnett permitting, drainage, sloped lots, demolition, backfill, typical costs, and backyard restoration.'
            },
            'vinings-pool-removal.html': {
              'desc': 'Pool removal in Vinings, GA with guidance for tight-access Cobb County lots, demolition, drainage, backfill, permitting, typical costs, and yard restoration.'
            },
            'woodstock-pool-removal.html': {
              'desc': 'Pool removal in Woodstock, GA with guidance on Cherokee County permitting, demolition options, access, drainage, backfill, typical costs, and yard restoration.'
            }
          }

          def update_meta(text, key, value, attr='name'):
              escaped = html.escape(value, quote=True)
              pat = re.compile(r'<meta\b[^>]*\b' + re.escape(attr) + r'="' + re.escape(key) + r'"[^>]*>', re.I)
              def repl(m):
                  tag = m.group(0)
                  if re.search(r'\bcontent="[^"]*"', tag, re.I):
                      return re.sub(r'\bcontent="[^"]*"', 'content="' + escaped + '"', tag, count=1, flags=re.I)
                  return tag[:-1] + ' content="' + escaped + '">'
              return pat.sub(repl, text, count=1)

          changed=[]
          for rel, vals in updates.items():
              p=Path(rel)
              text=p.read_text(encoding='utf-8')
              new=text
              if 'title' in vals:
                  esc=html.escape(vals['title'], quote=False)
                  new=re.sub(r'<title>.*?</title>', '<title>'+esc+'</title>', new, count=1, flags=re.I|re.S)
                  new=update_meta(new, 'og:title', vals['title'], 'property')
                  new=update_meta(new, 'twitter:title', vals['title'])
              if 'desc' in vals:
                  new=update_meta(new, 'description', vals['desc'])
                  new=update_meta(new, 'og:description', vals['desc'], 'property')
                  new=update_meta(new, 'twitter:description', vals['desc'])
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(rel)

          # Remove duplicate social meta tags by exact property/name, preserving the first occurrence.
          for p in sorted(Path('.').rglob('*.html')):
              if any(part in {'.git','scratch','gsc','improvements','crawl_stats'} for part in p.parts):
                  continue
              text=p.read_text(encoding='utf-8')
              seen=set()
              def dedupe(m):
                  tag=m.group(0)
                  mm=re.search(r'\b(name|property)="((?:twitter|og):[^"]+)"', tag, re.I)
                  if not mm:
                      return tag
                  k=mm.group(2).lower()
                  if k in seen:
                      return ''
                  seen.add(k)
                  return tag
              new=re.sub(r'<meta\b[^>]*(?:name|property)="(?:twitter|og):[^"]+"[^>]*>\s*', dedupe, text, flags=re.I)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  if str(p) not in changed:
                      changed.append(str(p))

          print('Updated metadata in', len(changed), 'files')
          for x in changed: print(x)
          PY
      - name: Verify metadata cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          bad=[]
          for p in sorted(Path('.').rglob('*.html')):
              if any(part in {'.git','scratch','gsc','improvements','crawl_stats'} for part in p.parts): continue
              t=p.read_text(encoding='utf-8', errors='ignore')
              desc=re.search(r'<meta\b[^>]*name="description"[^>]*content="([^"]*)"', t, re.I)
              title=re.search(r'<title>(.*?)</title>', t, re.I|re.S)
              if not title or not desc: bad.append((str(p),'missing'))
              elif desc.group(1).strip().endswith('...'): bad.append((str(p),'truncated description'))
              keys=[]
              for m in re.finditer(r'<meta\b[^>]*(?:name|property)="((?:twitter|og):[^"]+)"[^>]*>', t, re.I): keys.append(m.group(1).lower())
              if len(keys)!=len(set(keys)): bad.append((str(p),'duplicate social metadata'))
          if bad:
              print('Metadata verification failures:')
              for x in bad: print(x)
              raise SystemExit(1)
          print('Metadata verification passed')
          PY
      - name: Commit metadata cleanup
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' 'blog/*.html' || true
          git add -u
          git commit -m 'SEO P0: clean inconsistent metadata'
          git push origin HEAD:seo-p0-metadata-cleanup
