# trigger county hub upgrade
name: Phase 1 county hub upgrade

on:
  push:
    branches:
      - seo-p1-county-hubs

permissions:
  contents: write

jobs:
  hubs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-p1-county-hubs
      - name: Upgrade county hubs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          hubs = {
            'fulton-county-pool-removal.html': {
              'county':'Fulton County',
              'title':'Fulton County Pool Removal | Cities, Cost & Permit Guide',
              'cities':[
                ('Alpharetta','alpharetta-pool-removal.html','North Fulton city guide for local access, lot conditions, and project planning.'),
                ('Sandy Springs','sandy-springs-pool-removal.html','City-specific guide for access, grading, and local project considerations.'),
                ('Roswell','roswell-pool-removal.html','Roswell-focused pool removal guide for local properties and site conditions.'),
              ]
            },
            'dekalb-county-pool-removal.html': {
              'county':'DeKalb County',
              'title':'DeKalb County Pool Removal | Cities, Cost & Permit Guide',
              'cities':[
                ('Decatur','decatur-pool-removal.html','Decatur-specific guide for tighter lots, access, and local project planning.'),
                ('Dunwoody','dunwoody-pool-removal.html','Dunwoody-focused guide for larger residential lots and local site considerations.'),
              ]
            },
            'cobb-county-pool-removal.html': {
              'county':'Cobb County',
              'title':'Cobb County Pool Removal | Cities, Cost & Permit Guide',
              'cities':[
                ('Marietta','marietta-pool-removal.html','Marietta-specific pool removal guide with local cost and project considerations.'),
                ('Kennesaw','kennesaw-pool-removal.html','Kennesaw-focused guide for residential pool demolition and site restoration.'),
                ('Vinings','vinings-pool-removal.html','Vinings-specific guide for access, demolition, and finished-yard planning.'),
              ]
            },
            'gwinnett-county-pool-removal.html': {
              'county':'Gwinnett County',
              'title':'Gwinnett County Pool Removal | Cities, Cost & Permit Guide',
              'cities':[
                ('Lawrenceville','lawrenceville-pool-removal.html','Lawrenceville-specific guide for residential pool removal and site planning.'),
                ('Duluth','duluth-pool-removal.html','Duluth-focused pool removal guide for local properties and access conditions.'),
                ('Suwanee','suwanee-pool-removal.html','Suwanee-specific guide for grading, drainage, and local project considerations.'),
                ('Snellville','snellville-pool-removal.html','Snellville-focused guide for older pools and backyard restoration planning.'),
                ('Buford','buford-pool-removal.html','Buford-specific guide for local site conditions and pool removal planning.'),
              ]
            },
          }

          for path,cfg in hubs.items():
              p=Path(path); t=p.read_text(encoding='utf-8')
              t=re.sub(r'<title>.*?</title>', f'<title>{cfg["title"]}</title>', t, count=1, flags=re.I|re.S)
              t=re.sub(r'(<meta\s+property="og:title"\s+content=")[^"]*(">)', r'\1'+cfg['title']+r'\2', t, count=1, flags=re.I)
              t=re.sub(r'(<meta\s+name="twitter:title"\s+content=")[^"]*(">)', r'\1'+cfg['title']+r'\2', t, count=1, flags=re.I)

              if 'county-hub-directory' not in t:
                  cards=[]
                  for city,href,desc in cfg['cities']:
                      cards.append(f'''        <div class="card" style="padding: 24px;">\n          <h3 style="margin-bottom: 10px;"><a href="{href}">{city} Pool Removal</a></h3>\n          <p style="margin-bottom: 12px; color: var(--text-muted);">{desc}</p>\n          <a href="{href}" style="font-weight: 700; color: var(--primary-orange);">Open {city} guide →</a>\n        </div>''')
                  module=f'''\n  <section class="county-hub-directory" style="padding: 64px 0; background: #fff; border-bottom: 1px solid #eee;">\n    <div class="container">\n      <div style="max-width: 850px; margin: 0 auto 36px; text-align: center;">\n        <h2>{cfg['county']} Pool Removal Hub</h2>\n        <p style="color: var(--text-muted); line-height: 1.7;">Use this page for the county-level overview: service options, cost factors, permit planning, demolition, drainage, and backfill. For city-specific search intent, choose the local guide below.</p>\n      </div>\n      <div class="grid-3" style="gap: 20px;">\n{chr(10).join(cards)}\n      </div>\n      <div style="margin-top: 36px; padding: 24px; background: var(--bg-offset); border-radius: 8px;">\n        <strong>County-wide planning resources:</strong>\n        <a href="cost.html">Pool removal cost</a> ·\n        <a href="atlanta-pool-removal-permits.html">Permit planning</a> ·\n        <a href="pool-removal.html">Removal process</a> ·\n        <a href="pool-demolition.html">Demolition options</a>\n      </div>\n    </div>\n  </section>\n'''
                  crumb=re.search(r'<div class="container seo-breadcrumb".*?</div>',t,re.I|re.S)
                  if not crumb:
                      raise SystemExit(f'Visible breadcrumb not found in {path}')
                  pos=crumb.end()
                  t=t[:pos]+module+t[pos:]

              p.write_text(t,encoding='utf-8')

          bad=[]
          for path,cfg in hubs.items():
              t=Path(path).read_text(encoding='utf-8')
              if 'county-hub-directory' not in t: bad.append((path,'module'))
              for _,href,_ in cfg['cities']:
                  if f'href="{href}"' not in t: bad.append((path,href))
              for href in ['cost.html','atlanta-pool-removal-permits.html','pool-removal.html','pool-demolition.html']:
                  if f'href="{href}"' not in t: bad.append((path,href))
              if f'<title>{cfg["title"]}</title>' not in t: bad.append((path,'title'))
          if bad:
              print(bad); raise SystemExit(1)
          print('County hub verification passed')
          PY
      - name: Commit county hub upgrades
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fulton-county-pool-removal.html dekalb-county-pool-removal.html cobb-county-pool-removal.html gwinnett-county-pool-removal.html
          git commit -m 'SEO P1: turn county pages into true internal-link hubs'
          git push origin HEAD:seo-p1-county-hubs
