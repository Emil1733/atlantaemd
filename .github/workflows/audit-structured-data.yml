name: Audit structured data

on:
  push:
    branches:
      - seo-p0-structured-data-cleanup

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit schema and NAP signals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          patterns={
            'LocalBusiness': r'"@type"\s*:\s*"LocalBusiness"',
            'fake_address': r'1234\s+Roswell\s+Rd\s+NE',
            'fake_phone': r'\(404\)\s*555-7823|\+14045557823|4045557823',
            'geo': r'"geo"\s*:',
            'openingHours': r'"openingHours"\s*:',
            'postalAddress': r'"@type"\s*:\s*"PostalAddress"',
          }
          for p in sorted(Path('.').rglob('*.html')):
              if any(part in {'.git','scratch','gsc','improvements','crawl_stats'} for part in p.parts):
                  continue
              t=p.read_text(encoding='utf-8',errors='ignore')
              hits=[k for k,pat in patterns.items() if re.search(pat,t,re.I)]
              if hits:
                  print(str(p),'|',','.join(hits))
          PY
