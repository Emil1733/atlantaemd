name: Final URL consistency cleanup

on:
  push:
    branches:
      - seo-p0-url-consistency

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-p0-url-consistency
      - name: Refresh sitemap lastmod
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sitemap.xml')
          t=p.read_text(encoding='utf-8')
          t=t.replace('<lastmod>2026-08-10</lastmod>','<lastmod>2026-09-04</lastmod>')
          p.write_text(t,encoding='utf-8')
          PY
      - name: Verify URL consistency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          BASE='https://atlantapoolremoval.com'
          SKIP={'.git','scratch','gsc','improvements','crawl_stats'}
          html=[]
          for p in sorted(Path('.').rglob('*.html')):
              if any(x in SKIP for x in p.parts): continue
              rel=p.as_posix()
              if rel=='index.html': url=BASE+'/'
              elif rel=='blog/index.html': url=BASE+'/blog/'
              else: url=BASE+'/'+rel
              html.append((p,url))
          tree=ET.parse('sitemap.xml')
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          entries=tree.getroot().findall('s:url',ns)
          sitemap={u.find('s:loc',ns).text.strip():u for u in entries}
          expected={u for _,u in html}
          bad=[]
          if expected-set(sitemap): bad.append(('missing sitemap',sorted(expected-set(sitemap))))
          if set(sitemap)-expected: bad.append(('extra sitemap',sorted(set(sitemap)-expected)))
          for u in entries:
              lm=u.find('s:lastmod',ns)
              if lm is None or lm.text.strip()!='2026-09-04': bad.append(('stale lastmod',u.find('s:loc',ns).text.strip()))
          for p,url in html:
              t=p.read_text(encoding='utf-8',errors='ignore')
              m=re.search(r'<link\b[^>]*rel=["\']canonical["\'][^>]*href=["\']([^"\']+)',t,re.I)
              if not m or m.group(1).rstrip('/')!=url.rstrip('/'): bad.append(('canonical',str(p)))
              if re.search(r'href=["\'](?:\.\./)?index\.html["\']',t,re.I): bad.append(('index home link',str(p)))
              if re.search(r'(?:href|src)=["\']http://(?:www\.)?atlantapoolremoval\.com',t,re.I): bad.append(('http internal',str(p)))
              if re.search(r'(?:href|src)=["\']https://www\.atlantapoolremoval\.com',t,re.I): bad.append(('www internal',str(p)))
          if bad:
              print(bad)
              raise SystemExit(1)
          print('Final URL consistency verification passed')
          PY
      - name: Commit sitemap refresh
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          git commit -m 'SEO P0: refresh sitemap lastmod after cleanup'
          git push origin HEAD:seo-p0-url-consistency
