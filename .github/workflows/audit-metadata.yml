name: Audit metadata

on:
  push:
    branches:
      - seo-p0-metadata-cleanup

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit HTML metadata
        shell: bash
        run: |
          # Trigger corrected cleanup and audit current branch state.
          python - <<'PY'
          from pathlib import Path
          import re
          from collections import Counter

          rows=[]
          for p in sorted(Path('.').rglob('*.html')):
              if any(part in {'.git','scratch','gsc','improvements','crawl_stats'} for part in p.parts): continue
              t=p.read_text(encoding='utf-8', errors='ignore')
              mt=re.search(r'<title>(.*?)</title>', t, re.I|re.S)
              md=re.search(r'<meta\s+name="description"\s+content="([^"]*)"', t, re.I|re.S)
              title=re.sub(r'\s+',' ',mt.group(1)).strip() if mt else ''
              desc=re.sub(r'\s+',' ',md.group(1)).strip() if md else ''
              tw=len(re.findall(r'<meta\s+name="twitter:', t, re.I))
              og=len(re.findall(r'<meta\s+property="og:', t, re.I))
              rows.append((str(p),title,desc,tw,og))
          tc=Counter(r[1] for r in rows if r[1]); dc=Counter(r[2] for r in rows if r[2])
          print('FILE | TITLE_LEN | DESC_LEN | TWITTER_TAGS | OG_TAGS | FLAGS')
          for path,title,desc,tw,og in rows:
              flags=[]
              if not title: flags.append('MISSING_TITLE')
              if title and (len(title)<30 or len(title)>65): flags.append('TITLE_LENGTH')
              if tc[title]>1: flags.append('DUP_TITLE')
              if not desc: flags.append('MISSING_DESC')
              if desc and (len(desc)<120 or len(desc)>160): flags.append('DESC_LENGTH')
              if desc.endswith('...'): flags.append('TRUNCATED_DESC')
              if dc[desc]>1: flags.append('DUP_DESC')
              if tw>5: flags.append('DUP_TWITTER')
              if og>5: flags.append('DUP_OG')
              if flags: print(path, '|', ','.join(flags), '|', title, '|', desc)
          PY
